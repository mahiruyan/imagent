services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imagent}
      POSTGRES_USER: ${POSTGRES_USER:-imagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imagent} -d ${POSTGRES_DB:-imagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-imagent}:${POSTGRES_PASSWORD:-imagent}@db:5432/${POSTGRES_DB:-imagent}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-imagent}:${POSTGRES_PASSWORD:-imagent}@db:5432/${POSTGRES_DB:-imagent}
    command: python -m app.workers.scan_worker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_dev:
