[project]
name = "imagent"
version = "0.1.0"
description = "Internal supplier discovery and enrichment backend."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "bcrypt<5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "openpyxl>=3.1",
  "passlib[bcrypt]>=1.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "pdf_analysis_pages*", "tests*"]
