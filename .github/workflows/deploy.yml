name: Deploy to Hetzner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory
        run: |
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "mkdir -p /opt/imagent"

      - name: Upload project
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude ".env.production" \
            --exclude ".pytest_cache" \
            --exclude ".ruff_cache" \
            --exclude "backups" \
            ./ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/imagent/"

      - name: Write production env
        run: |
          cat > .env.production.deploy <<EOF
          ENVIRONMENT=production
          LOG_LEVEL=INFO
          MAP_PROVIDER=yandex
          POSTGRES_DB=imagent
          POSTGRES_USER=imagent
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://imagent:${{ secrets.POSTGRES_PASSWORD }}@db:5432/imagent
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          YANDEX_JS_API_KEY=${{ secrets.YANDEX_JS_API_KEY }}
          YANDEX_PLACES_API_KEY=${{ secrets.YANDEX_PLACES_API_KEY }}
          EXPORT_TEMPLATE_PATH=
          FRONTEND_ORIGINS=${{ secrets.FRONTEND_ORIGINS }}
          WEB_PORT=8000
          EOF
          scp .env.production.deploy "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/imagent.env"
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "mv /tmp/imagent.env /opt/imagent/.env.production && chmod 600 /opt/imagent/.env.production"

      - name: Deploy containers
        run: |
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" <<'EOF'
          set -e
          cd /opt/imagent
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d db
          docker compose -f docker-compose.prod.yml --env-file .env.production run --rm web alembic upgrade head
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
          docker compose -f docker-compose.prod.yml --env-file .env.production ps
          EOF
